<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Withdraw | BankEase</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container narrow"><a class="back-link" href="/dashboard">← Back to Dashboard</a><p class="eyebrow">BANKING SERVICE</p><h1>Withdraw Money</h1><p class="muted">Select your account and enter the amount to withdraw.</p><p class="success" th:if="${message}" th:text="${message}"></p><p class="error" th:if="${error}" th:text="${error}"></p>
<div class="empty-state" th:if="${#lists.isEmpty(accounts)}"><p>You need an account before making a withdrawal.</p><a class="button primary" href="/account/open">Open Account</a></div>
<form class="form-card" th:if="${!#lists.isEmpty(accounts)}" method="post" th:action="@{/account/withdraw}"><label>Select account</label><select name="accountId" required><option th:each="a : ${accounts}" th:value="${a.id}" th:text="${a.accountNumber} + ' — ₹' + ${#numbers.formatDecimal(a.balance,1,2)}"></option></select><label>Withdrawal amount (₹)</label><input name="amount" type="number" min="0.01" step="0.01" required><button class="primary full" type="submit">Confirm Withdrawal</button></form></main></body></html>

<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Open Account | BankEase</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments :: nav}"></div><main class="container narrow">
<a class="back-link" href="/dashboard">← Back to Dashboard</a><p class="eyebrow">ACCOUNT APPLICATION</p><h1>Open a Bank Account</h1><p class="muted">Enter your details to create your BankEase account.</p>
<p class="error" th:if="${error}" th:text="${error}"></p>
<form class="form-card" method="post" th:action="@{/account/open}">
<h2>Personal information</h2>
<label>Full name</label><input type="text" th:value="${user.fullName}" readonly>
<label>Registered email</label><input type="email" th:value="${user.email}" readonly>
<div class="form-row"><div><label>Mobile number</label><input name="mobileNumber" type="tel" pattern="[0-9]{10}" maxlength="10" placeholder="10-digit mobile number" required></div><div><label>Date of birth</label><input name="dateOfBirth" type="date" required></div></div>
<label>Residential address</label><textarea name="address" rows="3" maxlength="500" placeholder="House number, street, city, state and PIN code" required></textarea>
<h2>Account information</h2>
<label>Account type</label><select name="accountType" required><option value="">Select account type</option><option value="SAVINGS">Savings Account</option><option value="CURRENT">Current Account</option></select>
<label>Initial deposit (₹)</label><input name="initialDeposit" type="number" min="0" step="0.01" value="0" required>
<h2>Nominee information <span class="muted">(optional)</span></h2>
<div class="form-row"><div><label>Nominee name</label><input name="nomineeName" placeholder="Nominee full name"></div><div><label>Relationship</label><input name="nomineeRelationship" placeholder="e.g. Parent, Spouse"></div></div>
<p class="muted small">This is a learning/demo banking application. Account creation and balances are simulated.</p>
<button class="primary full" type="submit">Submit & Create Account</button>
</form></main></body></html>

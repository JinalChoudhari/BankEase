<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Login | BankEase</title><link rel="stylesheet" href="/css/style.css"></head><body class="auth"><main class="auth-card"><h1>BankEase</h1><p class="muted">Sign in to your banking account</p><p class="success" th:if="${param.registered}">Registration successful. Please log in.</p><p class="success" th:if="${param.logout}">You have been logged out.</p><p class="error" th:if="${param.error}">Invalid email or password.</p><form method="post" th:action="@{/login}"><label>Email</label><input name="username" type="email" required placeholder="you@example.com"><label>Password</label><input name="password" type="password" required placeholder="Password"><button class="primary full" type="submit">Login</button></form><p class="muted">New customer? <a href="/register">Create an account</a></p></main></body></html>

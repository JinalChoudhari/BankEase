<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Account Details | BankEase</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div>
<main class="container"><a class="back-link" href="/dashboard">← Back to Dashboard</a><p class="eyebrow">YOUR BANKING PROFILE</p><h1>Account Details</h1><p class="success" th:if="${message}" th:text="${message}"></p>
<div th:if="${#lists.isEmpty(accounts)}" class="empty-state"><h2>No bank account yet</h2><p class="muted">Open an account to see your details here.</p><a class="button primary" href="/account/open">Open Account</a></div>
<div class="account-detail-grid" th:each="a : ${accounts}"><section class="detail-card"><p class="eyebrow" th:text="${a.accountType} + ' ACCOUNT'">ACCOUNT</p><h2 th:text="${a.accountNumber}"></h2><p class="balance" th:text="'₹ ' + ${#numbers.formatDecimal(a.balance,1,2)}"></p><span class="pill" th:text="${a.status}"></span><p class="muted small" th:text="'Opened: ' + ${#temporals.format(a.createdAt,'dd MMM yyyy')}"></p></section>
<section class="detail-card"><h2>Personal details</h2><p><b>Name:</b> <span th:text="${user.fullName}"></span></p><p><b>Email:</b> <span th:text="${user.email}"></span></p><p><b>Mobile:</b> <span th:text="${a.mobileNumber}"></span></p><p><b>Date of birth:</b> <span th:text="${a.dateOfBirth}"></span></p><p><b>Address:</b> <span th:text="${a.address}"></span></p><p><b>Nominee:</b> <span th:text="${a.nomineeName != null ? a.nomineeName : 'Not provided'}"></span></p><p><b>Relationship:</b> <span th:text="${a.nomineeRelationship != null ? a.nomineeRelationship : 'Not provided'}"></span></p></section></div>
</main></body></html>

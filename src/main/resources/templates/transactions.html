<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><title>Transaction History | BankEase</title><link rel="stylesheet" href="/css/style.css"></head><body><div th:replace="~{fragments :: nav}"></div><main class="container"><a class="back-link" href="/dashboard">← Back to Dashboard</a><p class="eyebrow">ACCOUNT ACTIVITY</p><h1>Transaction History</h1><p class="muted">Transactions across all your BankEase accounts.</p>
<div class="table-wrap"><table><thead><tr><th>Date</th><th>Account</th><th>Type</th><th>Description</th><th>Amount</th></tr></thead><tbody><tr th:each="t : ${transactions}"><td th:text="${#temporals.format(t.createdAt,'dd MMM yyyy HH:mm')}"></td><td th:text="${t.account.accountNumber}"></td><td th:text="${t.type}"></td><td th:text="${t.description}"></td><td th:text="'₹ ' + ${#numbers.formatDecimal(t.amount,1,2)}"></td></tr><tr th:if="${#lists.isEmpty(transactions)}"><td colspan="5" class="muted">No transactions yet.</td></tr></tbody></table></div></main></body></html>
